<svg xmlns="http://www.w3.org/2000/svg" width="152.17" height="111.30" viewBox="23.91 53.15 152.17 111.30" role="img" aria-label="Illustration : un wallet vide">
  <!-- KALA (clone P0) : état vide illustré de /wallet — portefeuille KOSHA ouvert d'où émerge une
       forme d'onde (signature KALA) : le wallet se remplit du cashback des cours, comme une portée
       se remplit mesure après mesure. Remplace la gamelle PASHU au ratio EXACT (152.17×111.30,
       même attributs width/height explicites — cf. note B43-9 d'origine : sans eux <img> ne peut
       pas dériver de ratio intrinsèque et la hauteur collapse à 0px avec `w-40` seul côté CSS ;
       zéro retouche de layout requise côté page). Strokes : mousse éclaircie #8fb47f (corps),
       terre éclaircie #c9a876 (forme d'onde) — tokens AA sur fond sombre. -->
  <ellipse cx="100" cy="150" rx="66" ry="9" fill="#0A0A0F" opacity="0.4"/>
  <!-- Forme d'onde sortant de la fente — signature KALA -->
  <g stroke="#c9a876" stroke-width="4" stroke-linecap="round">
    <line x1="72" y1="103" x2="72" y2="112"/>
    <line x1="82" y1="98" x2="82" y2="117"/>
    <line x1="92" y1="92" x2="92" y2="123"/>
    <line x1="102" y1="96" x2="102" y2="119"/>
    <line x1="112" y1="101" x2="112" y2="114"/>
    <line x1="122" y1="104" x2="122" y2="111"/>
  </g>
  <!-- Corps du portefeuille ouvert -->
  <g stroke="#8fb47f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="42" y="104" width="116" height="46" rx="10"/>
    <path d="M42 118 v-4 a10 10 0 0 1 10-10 h96 a10 10 0 0 1 10 10 v4"/>
    <line x1="132" y1="127" x2="158" y2="127"/>
    <circle cx="145" cy="127" r="3.5"/>
  </g>
  <circle cx="62" cy="70" r="3" fill="#8fb47f" opacity="0.35"/>
  <circle cx="138" cy="62" r="2.4" fill="#8fb47f" opacity="0.3"/>
  <circle cx="104" cy="76" r="2" fill="#8fb47f" opacity="0.25"/>
</svg>
