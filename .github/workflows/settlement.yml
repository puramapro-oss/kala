name: KALA webhook regression

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  settlement:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
      - name: Install the locked application and test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run application unit tests and check types
        run: |
          npm test
          npm run typecheck -- --incremental false
      - name: Run the signed webhook against isolated PostgreSQL and simulated providers
        run: python3 tests/settlement/postgres.py
